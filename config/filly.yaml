{
  "project": {
    "name": "filly",
    "seed": 20260905
  },
  "sqlite": {
    "read_only": true,
    "fetch_size": 50000
  },
  "dataset": {
    "target_total_pairs": 1000000,
    "counting_mode": "balarila_total",
    "errorful_fraction": 0.83,
    "identity_fraction": 0.17
  },
  "input_contract": {
    "primary_corpus_already_deduplicated": true,
    "verify_unique_text_hashes": true,
    "fail_on_duplicate_contract_violation": true,
    "perform_primary_near_dedupe": false
  },
  "splits": {
    "train": 0.70,
    "dev": 0.15,
    "synthetic_test": 0.15,
    "group_by_document": true
  },
  "balarila": {
    "enforce_table2_registry": true,
    "table2_tag_count": 39,
    "allow_unregistered_tags": false,
    "one_error_baseline": true
  },
  "stage_views": {
    "dataset1_errorful_share": 0.80,
    "dataset2_errorful_share": 0.20
  },
  "phase9": {
    "candidate_buffer_ratio": 1.25,
    "require_aggregate_manifest": true
  },
  "morphology": {
    "primary_seed": "unimorph_tgl",
    "require_frozen_resource_version": true,
    "minimum_validated_states_per_lemma": 3,
    "allow_table3_source_states": [
      "BASE", "COMPACT", "INCACT", "CONTACT", "IMPACT",
      "COMPOBJ", "INCOBJ", "CONTOBJ", "IMPOBJ", "RECCOMP"
    ],
    "allowed_target_correction_states": [
      "BASE", "COMPACT", "INCACT", "CONTACT",
      "COMPOBJ", "INCOBJ", "CONTOBJ", "RECCOMP"
    ]
  },
  "balitanlp": {
    "enabled": false,
    "use_only_on_shortfall": true,
    "excluded_publishers": ["bandera", "bandera.inquirer"],
    "cross_corpus_exact_duplicate_check": true,
    "cross_corpus_near_duplicate_check": "optional_conservative",
    "rerun_primary_corpus_dedupe": false
  },
  "evaluation": {
    "end_to_end_test_is_separate_from_1m": true,
    "conditions": [
      "raw_to_gec",
      "raw_to_normalizer_to_gec",
      "oracle_normalized_to_gec"
    ]
  },
  "quality": {
    "unicode_normalization": "NFC",
    "collapse_whitespace": true,
    "reject_empty": true,
    "reject_nul": true,
    "require_letter": true,
    "max_characters": 2000,
    "min_alphabetic_ratio": 0.20,
    "max_repeated_punctuation": 4,
    "boilerplate_patterns": ["^(read more|advertisement)$"],
    "reject_upstream_duplicate_marker": true,
    "required_language": "FILIPINO",
    "min_language_confidence": 0.80,
    "check_language_code_switch_ratio": true,
      "language_code_switch_min_tokens": 8,
      "language_code_switch_min_markers": 4,
      "language_code_switch_borderline_ratio": 0.50,
      "language_code_switch_max_marker_ratio": 0.75,
      "language_code_switch_clause_min_tokens": 4,
      "language_code_switch_clause_min_markers": 2,
      "language_code_switch_clause_min_content": 2,
      "language_code_switch_boundary_tokens": [
        "ang", "ng", "mga", "sa", "para", "kay", "ni", "si", "at",
        "na", "ay", "dahil", "kung", "nang", "upang", "ito", "iyon"
      ],
      "language_code_switch_content_words": [
        "act", "announced", "change", "changes", "city", "climate",
        "country", "government", "hold", "local", "new", "people",
        "plan", "policy", "responsible", "team", "teams", "them"
      ],
    "language_code_switch_marker_words": [
      "the", "and", "of", "to", "in", "for", "with", "on", "from",
      "is", "are", "was", "were", "this", "that", "it", "as", "at",
      "by", "be", "have", "has", "had", "will", "can", "you", "we",
      "they", "he", "she", "a", "an"
    ],
    "check_balanced_delimiters": true,
    "check_sentence_integrity": true,
    "sentence_integrity_min_tokens": 1,
    "reject_suspicious_encoding": true,
    "suspicious_encoding_patterns": [
      "\uFFFD", "\u00EF\u00BF\u00BD", "\u00C3\u00A9", "\u00C3\u00A1",
      "\u00C3\u00AD", "\u00C3\u00B3", "\u00C3\u00BA", "\u00C3\u00B1",
      "\u00C3\u00BC", "\u00E2\u20AC\u2122", "\u00E2\u20AC\u0153",
      "\u00E2\u20AC\u009D", "\u00E2\u20AC\u2013", "\u00E2\u20AC\u2014",
      "\u00E2\u20AC\u00A6"
    ],
    "check_formality": true,
    "formality_patterns": [
      "(?i)(?<!\\w)(lol|lmao|omg|hahaha+|hehe+)(?!\\w)",
      "(?i)(?<!\\w)(xd|wla|d2|aq)(?!\\w)"
    ],
    "reject_urls_and_email": true
  }
}
